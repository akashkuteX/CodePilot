services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codepilot-postgres

    environment:
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codepilot

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: